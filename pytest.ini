[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --junit-xml=results.xml --html=reports/report.html --self-contained-html
markers =
    smoke: Quick sanity smoke tests
    regression: Master end-to-end regression test flows
    accounting: Financial, daybook, ledger and double-entry tests
    default_vertical: Standard retail/commerce vertical flows
    restaurant: Restaurant POS specific flows
    galaxy: Mobile galaxy flows
    data_creation: Isolated data creation tests (skipped in routine regression)
